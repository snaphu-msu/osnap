###############################################################################
### GENERAL SETTINGS
###    Settings related to how the data should be loaded.
###############################################################################

# TODO: Allow specifying when a column is in log and convert them to linear

# What type of file is it? Options: 'csv', 'hdf5'
file_type: ''

# Is the data separated into multiple files?
# TODO: Add support for split files
split_files: false

# Are zones ordered in ascending mass/radius or descending?
zone_order: 'ascending'

###############################################################################
### CSV SETTINGS
###    Settings related to loading the data as a CSV file.
###############################################################################

# How many rows should be skipped at the top of the file?
skiprows: 0

# If it's a CSV file, what is the delimiter? Options: 'whitespace', 'tab', ',', etc.
delimiter: ''

# What string is used in place of missing data?
missing_data: ''


###############################################################################
### AMR SETTINGS
###    Settings related to how the data is structured/ordered 
###    when using AMR blocks.
###############################################################################

# Is the data broken up into AMR blocks? 
# If false, OSNAP will assume that all data is in a single block.
use_amr: false

# The name of the dataset containing info about which blocks are leaf nodes
# If blank, OSNAP will assume that all blocks are leaf nodes
node_type: ''

# The value in the node_type dataset that indicates a leaf node
leaf_node: 0.0

# The name of the dataset containing the bounding box coordinates for each block
bounding_box: ''

# Units for the bounding box coodinates
bounding_box_units: 'cm'

# Which axis 
block_axis: 0
radial_axis: 3


###############################################################################
### COMPOSITION
###    Settings related to how composition data is formatted.
###############################################################################

composition_type: 'mass fraction' # Options: 'mass fraction', 'number fraction'

# What are the column names for specific particles and isotopes?
neutrons: '' 
protons: ''
deuterium: ''
tritium: ''

# A list of column names for elements that are grouped together (e.g. Fe, Ni, etc.)
element_groups: []

# A list of all column names corresponding to isotopes included in the data
# Does not need to include any already specified above (e.g. neutrons, protons, 
# deuterium, tritium, and anything in element_groups)
isotopes: []


###############################################################################
### COLUMN INFORMATION
###
###    MUST FOLLOW FORMAT: 
###      variable: [column_name, units, location]
###
###    WHERE:
###      variable: The name OSNAP uses interally.
###      column_name: The name of the column in the data file
###      units: The units used for that column (in astropy.units format), 
###             leave blank if dimensionless.
###      location: Where the value is measured. 
###                Options include 'outer', 'center', 'average'
###
###    NOTE:
###      Excepting the above composition, only columns listed below will be 
###      loaded into the ODB file. You can include additional columns from 
###      the source file by adding them to the list but they will be ignored
###      by OSNAP generally.
###
###############################################################################

column_info:
  cell_mass: []
  enclosed_mass: []
  radius: []
  radial_velocity: []
  cell_volume: []
  angular_velocity: []
  density: []
  temperature: []
  pressure: []
  specific_entropy: [] 
  A_bar: []
  Y_e: []
  shock: []
  specific_energy: []
  kinetic_energy: []
  internal_energy: []
  turbulent_energy: []
  grav_potential: []

# What types of energy are included in the specific energy column?
# Options include: 'kinetic', 'internal', 'turbulent', 'gravitational'
# TODO: Implement code to add missing energy as needed
specific_energy_includes: ['kinetic', 'internal']

