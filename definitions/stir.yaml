# For details about each setting in these files, see comments in the template.yaml file.

###############################################################################
### GENERAL SETTINGS
###    Settings related to how the data should be loaded.
###############################################################################
file_type: "hdf5"
split_files: false
skiprows: 1
delimiter: "whitespace"
missing_data: '---'
zone_order: 'ascending'


###############################################################################
### HDF5 AMR SETTINGS
###    Settings related to how the data is structured/ordered.
###############################################################################
uses_amr: true
node_type: 'node type'
leaf_node: 1.0
bounding_box: 'bounding box'
bounding_box_units: 'cm'
bounding_box_radial_index: 0
radial_axis: 3


###############################################################################
### COMPOSITION
###    Settings related to how composition data is formatted.
###############################################################################
composition_type: 'mass fraction'
neutrons: '' 
protons: ''
deuterium: ''
tritium: ''
element_groups: []
isotopes: []


###############################################################################
### COLUMN INFORMATION
###
###    MUST FOLLOW FORMAT: 
###      variable: [column_name, units, location]
###
###    WHERE:
###      variable: The name OSNAP uses interally.
###      column_name: The name of the column in the data file
###      units: The units used for that column (in astropy.units format), 
###             leave blank if dimensionless.
###      location: Where the value is measured. 
###                Options include 'outer', 'center', 'average'
###
###    NOTE:
###      Excepting the above composition, only columns listed below will be 
###      loaded into the ODB file. You can include additional columns from 
###      the source file by adding them to the list but they will be ignored
###      by OSNAP generally.
###
###############################################################################
column_info:
  cell_mass: []
  enclosed_mass: []
  radius: []
  radial_velocity: ['velx', 'cm/s', 'average']
  cell_volume: []
  angular_velocity: []
  density: ['dens', 'g/cm^3', 'average']
  temperature: ['temp', 'K', 'average']
  pressure: ['pres', 'dyne/cm^2', 'average']
  specific_entropy: ['entr', 'k_B/baryon', 'average'] 
  A_bar: []
  Y_e: ['ye  ', '', 'average']
  shock: ['shok', '', 'average']
  specific_energy: ['ener', 'erg/g', 'average']
  kinetic_energy: []
  internal_energy: ['eint', 'erg/g', 'average']
  turbulent_energy: ['etrb', 'erg/g', 'average']
  grav_potential: ['gpot', 'erg/g', 'average']

specific_energy_includes: ['kinetic', 'internal']

